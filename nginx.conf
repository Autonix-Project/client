server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API 경로 → api-gateway 프록시
    location /orders {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /dashboard {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 설정
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        proxy_cache off;
    }

    location /lines {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /shippings {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /inventory {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /simulator {
        proxy_pass http://api-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router SPA - 나머지 모든 경로를 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
